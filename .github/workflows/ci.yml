name: CI

on: 
    push:
    pull_request:

jobs: 
    test: 
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: '3.12' 
            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
            - run: uv sync --locked 
            - run: uv run pytest
